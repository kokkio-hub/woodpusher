<style>
  /* The same desk as the app (front/app.html): espresso leather and tan in the dark look, off-white and walnut in the light one */
  :root {
    --leather: #17110d; --leather-hi: #271b13; --leather-lo: #0c0805;
    --brass: #c98b52; --brass-hi: #e8b884; --ivory: #f4ede6; --ivory-dim: #b9aa9a;
    --line: 201,139,82; --well: 0,0,0; --well-k: 1;
    --c-blunder: #c9392e;
    --f-display: Outfit, Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
    --f-body: Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
    --f-mono: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  :root[data-look="light"] {
    --leather: #f3f1ef; --leather-hi: #ffffff; --leather-lo: #e9e4df;
    --brass: #7b4b2a; --brass-hi: #7b4b2a; --ivory: #24170f; --ivory-dim: #5e5853;
    --line: 123,75,42; --well: 255,255,255; --well-k: 4;
    color-scheme: light;
  }
  html, body { min-height: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    background-color: var(--leather);
    background-image: radial-gradient(130% 90% at 50% 0%, var(--leather-hi), var(--leather) 52%, var(--leather-lo));
    color: var(--ivory); font: 17px/1.55 var(--f-body); -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
  }
  :focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
  a { color: var(--brass-hi); }

  .topbar { width: 100%; max-width: 1180px; margin: 0 auto; padding-block: 14px 12px; border-bottom: 1px solid rgba(var(--line),.22); }
  .lockup { --lk: 25px; display: inline-flex; align-items: center; gap: calc(var(--lk) * .36); font-size: var(--lk); line-height: 1; color: inherit; text-decoration: none; border-radius: 4px; }
  .lk-knight { height: calc(var(--lk) * 1.4); width: auto; aspect-ratio: 120 / 140; display: block; flex: none; overflow: visible; --k-fill: var(--brass); --k-cut: var(--leather); }
  .lk-word { font-family: var(--f-display); font-weight: 600; letter-spacing: -.035em; color: var(--ivory); padding-bottom: .06em; white-space: nowrap; }

  main { flex: 1; width: 100%; max-width: 920px; margin: 0 auto; padding: 40px 0 56px; display: flex; align-items: center; justify-content: center; gap: 56px; }
  .art { width: 260px; height: auto; flex: none; display: block; overflow: visible; }
  .art .knight { --k-fill: var(--brass); --k-cut: var(--leather); }
  .art .ghost { fill: rgba(247,190,70,.16); stroke: rgba(var(--line),.75); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .art .sq-name { font: 11px/1 var(--f-mono); fill: var(--ivory-dim); }
  .text { max-width: 30rem; }
  .code { margin: 0 0 12px; font-weight: 700; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ivory-dim); }
  h1 { margin: 0 0 14px; font-family: var(--f-display); font-weight: 600; font-size: clamp(34px, 6vw, 48px); line-height: 1.05; letter-spacing: -.03em; color: var(--brass-hi); text-wrap: balance; }
  .lead { margin: 0 0 26px; font-size: 18px; color: var(--ivory-dim); text-wrap: pretty; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }

  .btn {
    font: 600 15px/1.1 var(--f-body); padding: 11px 16px; border-radius: 5px; text-decoration: none;
    border: 1px solid rgba(var(--line),.45); background: rgba(var(--well), calc(.2 * var(--well-k))); color: var(--ivory);
    transition: background .15s, border-color .15s, transform .05s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover { border-color: var(--brass); background: rgba(var(--line),.13); }
  .btn:active { transform: translateY(1px); }
  .btn-brass {
    background: linear-gradient(180deg, #e4ae78, #c98b52 55%, #a8703f); color: #1c120b; border-color: #5c3a21;
    box-shadow: inset 0 1px 0 rgba(255,236,214,.6), 0 2px 0 #3f2716, 0 8px 16px -8px rgba(0,0,0,.7);
    text-shadow: 0 1px 0 rgba(255,240,200,.45);
  }
  .btn-brass:hover { background: linear-gradient(180deg, #ecbd8a, #d39760 55%, #b07a47); border-color: #5c3a21; }

  .foot { width: 100%; max-width: 1180px; margin: 0 auto; padding-block: 10px 26px; border-top: 1px solid rgba(var(--line),.18); color: var(--ivory-dim); font-size: 13px; }

  @media (max-width: 720px) {
    main { flex-direction: column; gap: 26px; padding: 28px 0 44px; text-align: center; }
    .art { width: min(220px, 62vw); }
    .actions { justify-content: center; }
  }
</style>
</head>
<body>

    <path style="fill: none; stroke: var(--k-cut, #17110d)" stroke-width="3" stroke-linecap="round" d="M71 28 C82 36 88 50 88 66 C88 80 85 92 81 102"/>

<header class="topbar">
  <a class="lockup" href="/" aria-label="Woodpusher, go to the home page">

<main>
  <!-- The top-right corner of the board (f6–h8). The knight has jumped from h7 to i9, which isn't on the board. -->
  <svg class="art" viewBox="0 0 260 260" role="img" aria-label="A knight that jumped from h7 to i9, a square that isn't on the board">
    <defs>
      <linearGradient id="nfFadeX" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".24" stop-color="#fff"/></linearGradient>
      <linearGradient id="nfFadeY" x1="0" y1="0" x2="0" y2="1"><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
      <mask id="nfMaskX" maskUnits="userSpaceOnUse" x="0" y="0" width="260" height="260"><rect width="260" height="260" fill="url(#nfFadeX)"/></mask>

    </defs>
    <g mask="url(#nfMaskY)"><g mask="url(#nfMaskX)">
      <!-- walnut frame along the top and right edge -->
      <path fill="#5e2b19" d="M0 70 H177 Q182 70 182 75 V260 H168 V84 H0 Z"/>
      <!-- maple and walnut squares: ranks 8, 7, 6 and the top of 5 -->
      <rect x="0" y="84" width="56" height="56" fill="#865836"/><rect x="56" y="84" width="56" height="56" fill="#ebd1a1"/><rect x="112" y="84" width="56" height="56" fill="#865836"/>
      <rect x="0" y="140" width="56" height="56" fill="#ebd1a1"/><rect x="56" y="140" width="56" height="56" fill="#865836"/><rect x="112" y="140" width="56" height="56" fill="#ebd1a1"/>
      <rect x="0" y="196" width="56" height="56" fill="#865836"/><rect x="56" y="196" width="56" height="56" fill="#ebd1a1"/><rect x="112" y="196" width="56" height="56" fill="#865836"/>
      <rect x="0" y="252" width="56" height="8" fill="#ebd1a1"/><rect x="56" y="252" width="56" height="8" fill="#865836"/><rect x="112" y="252" width="56" height="8" fill="#ebd1a1"/>
      <!-- h7: where the knight came from, highlighted like the last move in the app -->
      <rect x="112" y="140" width="56" height="56" fill="rgba(247,190,70,.5)"/>

    <rect class="ghost" x="196.75" y=".75" width="54.5" height="54.5" rx="3"/>
    <text class="sq-name" x="248" y="51" text-anchor="end">i9</text>
    <!-- the knight's move, as an L-shaped arrow -->
    <path d="M140 168 V28 H186" fill="none" stroke="var(--c-blunder)" stroke-opacity=".85" stroke-width="7" stroke-linejoin="round"/>
    <path d="M185 17 L200 28 L185 39 Z" fill="var(--c-blunder)" fill-opacity=".85"/>
    <use class="knight" href="#wpKnight" x="209" y="9" width="30" height="35"/>
    <!-- the review's blunder badge -->
    <circle cx="249" cy="9" r="9.5" fill="var(--c-blunder)"/>
    <text x="249" y="12.6" text-anchor="middle" fill="#fff" style="font: 700 10.5px/1 var(--f-body); letter-spacing: -.04em">??</text>
  </svg>

  <div class="text">
    <p class="code">404 · Page not found</p>
    <h1>There’s no square i9</h1>
    <p class="lead">This page isn’t on the board. The link may be out of date, or there’s a typo in the address.</p>
    <div class="actions">
      <a class="btn btn-brass" href="/">Back to the board</a>

  </div>
</main>
